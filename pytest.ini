[pytest]
testpaths = agentbench/tests embeddings/tests
python_files = test_*.py
xfail_strict = true
markers =
    slow: large-context / long-generation tests (opt-in via --run-slow)
    concurrency: multi-request parallelism tests (opt-in via --run-concurrency)
    streaming: SSE streaming tests
    tool_calling: tool-call wire-format tests
    reasoning: reasoning/thinking extraction tests
    anthropic: Anthropic /v1/messages protocol tests
    responses: OpenAI /v1/responses protocol tests
    openai: OpenAI /v1/chat/completions protocol tests
    tei: Qwen3 TEI embedding backend (:8004)
    gemma: EmbeddingGemma-2 multimodal backend (:8005)
    multimodal: image/audio/video embedding input forms
    batch: multi-input embedding requests
addopts = -ra
